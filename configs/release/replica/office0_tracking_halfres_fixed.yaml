workspace_dir: output/release/replica/office0_tracking_halfres_fixed
dev_id: 0
work_mode: train

READER:
  input_dir: data/replica/office0
  image_path: camera
  pose_path: camera
  depth_path: depth
  pcd_name: "sampled_pcd_50w"

  depth_scale: 6553.5
  scene_scale: 1.0
  start_frame: 0
  end_frame: 1999
  frame_step: 1
  
  # ═══════════════════════════════════════════════════════════════════════════
  # CRITICAL FIX: Scaled intrinsics for half resolution
  # Original full-res: [600, 600, 599.5, 339.5]
  # Half-res scaled:   [300, 300, 299.75, 169.75]
  # ═══════════════════════════════════════════════════════════════════════════
  # fx, fy, cx, cy
  intrinsics: [300.0, 300.0, 299.75, 169.75]
  
  # Half resolution settings
  image_shape: [600, 340] 
  downscale_factor: 2                                 
  test_split_interval: -1


PIPE:
  train_mode: ges
  max_iterations: 10000
  enable_densify: false
  eval_after_train: true
  save_after_train: true
  selected_cam_idx: -1
  model_path: "/gs_model"   
  log_path: "/log" 
  eval_path: "/val"
  log_iter: 1000
  weight_configs:
    ssim_weight: 0.0
    depth_weight: 0.0
  vis_configs:
    color_error_max: 0.1 
    depth_error_max: 0.1
    depth_vis_max: 5
    depth_vis_min: 0
    alpha_vis_max: 5
  
  # SLAM setting - ENABLED for pose logging
  log_slam_state: true
  new_gs_sample_ratio: 0.25
  color_error_thres: 0.05
  localframe_cam_window_length: 2
  localframe_cam_window_interval: 5
  
  # ═══════════════════════════════════════════════════════════════════════════
  # TRACKING-OPTIMIZED SETTINGS
  # More iterations for better convergence during tracking
  # ═══════════════════════════════════════════════════════════════════════════
  local_opt_iters: 25
  local_opt_interval: 5
  
  # More conservative keyframe selection for stability
  keyframe_theta_thres: 15
  keyframe_trans_thres: 0.15
  keyframe_select_max: 8
  keyframe_sample_configs:
    weight_intervel: 0.01
    loss_thres: 0.02
    opt_thres: 50
    sample_method: random

  remove_configs:
    large_scale_thres: 0.1
    small_scale_thres: 0.003
    low_opac_thres: 0.005

  TSDF:
    # ═══════════════════════════════════════════════════════════════════════════
    # TUNED FOR HALF-RESOLUTION TRACKING
    # Smaller voxel size for better geometry at lower resolution
    # ═══════════════════════════════════════════════════════════════════════════
    voxel_size: 0.008
    trunc_dist: 0.032
    
    # Adjusted view frustum for half-res depth maps
    # At half res, depth noise is effectively doubled, so be more conservative
    viewFrustum_min: 0.3
    viewFrustum_max: 8.0
    
    load_images: true    
    # ONLINE TRACKING - DO NOT use GT pose
    use_gt_pose: false
    saved_mesh: ""
    saved_engine: "tsdf_engine/"
    saved_images: raycasted


MODEL:
  render_method: ges
  max_gs_radii: 100
  delta_depth: 0.1
  
  # ═══════════════════════════════════════════════════════════════════════════
  # Higher SH degree for better tracking quality
  # At half res, we need better appearance modeling
  # ═══════════════════════════════════════════════════════════════════════════
  sh_degree: 3 
  sh_degree_interval: 0
  max_init_scale: 0.01
  min_init_scale: -1
  default_opacities: 0.5

  # learning rates
  means_lr: 0.00016
  means_lr_final: 0.0000016
  scales_lr: 0.005
  quats_lr: 0.001
  featuresDc_lr: 0.0025
  featuresRest_lr: 0.0005
  opacities_lr: 5e-2
  exposure_lr: 0.003
  use_exposure: false

  # densify parameters
  densify_start_iter: 500
  densify_end_iter: 6000
  densify_interval: 100
  densify_grad_thres: 0.0002
  densify_large_thres: 0.01
  split_screen_size: 0.05 
  reset_opacity_interval: 3000
  prune_opacity_thres: 0.005
