workspace_dir: output/release/replica/office0
dev_id: 0
work_mode: train

READER:
  preload_images: true
  input_dir: data/replica/office0
  image_path: camera
  pose_path: camera
  depth_path: depth
  pcd_name: "sampled_pcd_50w"

  depth_scale: 6553.5
  scene_scale: 1.0
  start_frame: 0
  end_frame: 1999
  frame_step: 1
  # fx, fy, cx, cy
  intrinsics: [600, 600, 599.5, 339.5]
  # width, height  
  image_shape: [1200, 680] 
  downscale_factor: 1                                    
  test_split_interval: -1


PIPE:
  train_mode: ges
  max_iterations: 10000
  enable_densify: false
  eval_after_train: true
  eval_sdf_only: false
  eval_split: train
  save_after_train: true
  selected_cam_idx: -1
  # output
  model_path: "/gs_model"   
  log_path: "/log" 
  eval_path: "/val"
  log_iter: 1000
  weight_configs:
    ssim_weight: 0.0
    depth_weight: 0.0
  vis_configs:
    color_error_max: 0.1 
    depth_error_max: 0.1
    depth_vis_max: 5
    depth_vis_min: 0
    alpha_vis_max: 5
  # SLAM setting
  log_slam_state: false
  # 1 preserves full research diagnostics; use 10 for long Thor throughput runs.
  submap_stats_interval_frames: 1
  new_gs_sample_ratio: 0.25
  color_error_thres: 0.05
  localframe_cam_window_length: 2
  localframe_cam_window_interval: 5
  local_opt_iters: 20
  local_opt_interval: 10
  keyframe_theta_thres: 30
  keyframe_trans_thres: 0.3
  keyframe_select_max: 7
  keyframe_sample_configs:
    weight_intervel: 0.01
    loss_thres: 0.02
    opt_thres: 50
    sample_method: random

  remove_configs:
    large_scale_thres: 0.1
    small_scale_thres: 0.003
    low_opac_thres: 0.005

  TSDF:
    engine: basic
    # Reproducible baseline. Use contain_failed to roll back failed poses
    # without suppressing recoverable TRACKING_POOR frames.
    tracking_failure_mode: legacy_ignore
    tracking_profile: legacy
    # Tracking experiments are opt-in; false preserves the original path.
    use_bilateral_filter: false
    use_approximate_raycast: false
    input_mode: preload
    input_prefetch: false
    # direct avoids the legacy tensor -> OpenCV -> InfiniTAM copy chain.
    input_tensor_bridge: direct
    input_tensor_bridge_validate: false
    voxel_size: 0.005
    trunc_dist: 0.02
    viewFrustum_min: 0.2
    viewFrustum_max: 10
    load_images: true    
    use_gt_pose: true
    require_raw_tracking_success: false
    raw_tracking_failure_grace_frames: 0
    saved_mesh: "tsdf_mesh.ply"
    saved_engine: "tsdf_engine/"
    saved_images: raycasted
    multi:
      force_single_submap: false
      console_diagnostics: false
      loop_closure: false
      global_adjustment: false
      loop_min_submap_separation: 3
      loop_candidate_cooldown_frames: 30
      boundary_policy: visibility
      sequential_transform_policy: validated_overlap
      sequential_transform_max_translation: 0.03
      sequential_transform_max_rotation_deg: 3.0
      invalid_transform_restart_attempts: 0
      handoff_pose_policy: candidate
      new_map_handoff_policy: visibility
      new_map_handoff_min_visible_ratio: 0.0
      new_map_handoff_min_visible_margin: 0.0
      new_map_handoff_min_accepts: 1
      candidate_recovery_policy: disabled
      candidate_recovery_min_visible_ratio: 0.3
      candidate_recovery_min_blocks: 1000
      candidate_recovery_max_attempts: 2
      primary_failure_handoff_policy: disabled
      primary_failure_handoff_min_raw_failed_frames: 30
      primary_failure_handoff_raw_gate: failed_only
      primary_failure_handoff_min_raw_weak_frames: 0
      primary_failure_handoff_min_candidate_visible_ratio: 0.5
      primary_failure_handoff_min_candidate_blocks: 1000
      primary_failure_handoff_min_candidate_good_frames: 10
      primary_failure_handoff_min_overlap_frames: 0
      primary_failure_handoff_require_pose_continuity: false
      tracking_boundary_policy: disabled
      raw_weak_boundary_frames: 3
      raw_failed_boundary_frames: 1
      tracking_boundary_min_primary_frames: 20
      tracking_boundary_cooldown_frames: 20
      tracking_boundary_force_handoff: true
      tracking_boundary_handoff_policy: weak_or_failed
      new_map_visible_ratio: 0.2
      overlap_frames: 40
      trial_frames: 60
      emergency_overlap_frames: 0
      sampled_original_blocks: 1000
      max_frames: 750
      new_map_block_occupancy: 0.86
      max_block_occupancy: 0.92
      occupancy_growth_lookahead_frames: 30
      occupancy_growth_min_primary_frames: 20
      occupancy_growth_sample_frames: 5
      skip_primary_fusion_on_capacity_handoff: false
      hash_profile: compact_64k
      resident_gpu_maps: auto
      gpu_reserve_mb: 3000
      paging: true
      paging_storage: disk
      async_page_out: false
      max_pending_page_snapshots: 1
      max_pending_page_snapshot_mb: 0
      async_page_in: false
      max_pending_page_ins: 1
      max_pending_page_in_mb: 0
      keep_runtime_pages_after_save: false
      max_render_maps: 4
      render_prefetch: false
      render_prefetch_lookahead_frames: 1
      render_prefetch_lookahead_max_maps: 0
      render_pin_primary_submap: true
      render_compositor: handoff_aware

  gaussian_submaps:
    enable: false
    ownership: legacy
    coordinate_frame: global
    max_gaussians: 80000
    max_new_gaussians_per_frame: 1000
    bootstrap_max_new_gaussians_per_frame: 0
    bootstrap_until_gaussians: 0
    bootstrap_until_age_frames: 0
    gaussian_insert_diagnostics: false
    gaussian_insert_min_age_frames: 0
    gaussian_insert_min_sdf_blocks: 0
    page_frozen_gaussians: false
    resident_gaussian_submaps: 3
    candidate_warming: true
    boundary_observation_handoff: true
    handoff_add_gaussians_to_outgoing: false
    gaussian_insert_selection: error_topk
    gaussian_insert_tile_size: 32
    gaussian_insert_tile_max_pixels: 0
    keyframe_selection_policy: random
    candidate_warm_interval: 1
    retire_unaccepted_candidates: true
    candidate_reject_retire: true
    candidate_reject_retire_min_rejects: 4
    candidate_reject_retire_min_observed_frames: 16
    candidate_reject_retire_min_gaussians: 1
    candidate_reject_retire_max_inliers: 1
    candidate_reject_retire_cooldown_frames: 30
    candidate_gaussian_insert_min_frames: 0
    candidate_immature_new_gs_sample_ratio: -1.0
    candidate_immature_max_new_gaussians_per_frame: 0
    candidate_extend_while_overlap: true
    candidate_max_warm_frames: 130
    candidate_handoff_max_opt_passes: 6
    candidate_handoff_opt_iters: -1
    handoff_frames: 30
    handoff_opt_iters: 3
    handoff_max_opt_passes: 4
    graduation_optimize: false
    graduation_opt_iters: 0
    graduation_keyframes: 8
    graduation_max_opt_passes: 1
    graduation_keyframe_policy: loss_temporal_mix
    graduation_observation_policy: temporal_spread
    graduation_adaptive: false
    graduation_adaptive_loss_sample_cameras: 6
    graduation_adaptive_target_loss: 0.0
    graduation_adaptive_min_abs_drop: 0.0001
    graduation_adaptive_min_rel_drop: 0.005
    graduation_readiness_enable: false
    graduation_readiness_sample_cameras: 5
    graduation_readiness_skip_gain: 0.0015
    graduation_readiness_min_abs_drop: 0.0001
    graduation_readiness_skip_min_observed_frames: 0
    graduation_readiness_skip_min_keyframes: 0
    training_observation_max_per_submap: 0
    training_observation_interval_frames: 10
    quality_finalize_enable: false
    quality_finalize_include_frozen: true
    quality_finalize_include_active: true
    quality_finalize_max_submaps: 2
    quality_finalize_max_observed_frames: 256
    quality_finalize_min_keyframes: 8
    quality_finalize_insert_enable: false
    quality_finalize_insert_include_frozen: false
    quality_finalize_insert_min_sdf_submaps: 2
    quality_finalize_insert_frames: 2
    quality_finalize_insert_max_new_gaussians_per_frame: 1500
    quality_finalize_insert_acceptance_enable: true
    quality_finalize_insert_acceptance_cameras: 5
    quality_finalize_insert_min_readiness_delta: 0.0
    frozen_refinement_enable: false
    frozen_refinement_interval_frames: 30
    frozen_refinement_opt_iters: 1
    frozen_refinement_keyframes: 6
    frozen_refinement_max_passes_per_submap: 1
    frozen_refinement_max_submaps_per_frame: 1
    frozen_refinement_min_new_observations: 1
    candidate_new_gs_sample_ratio: -1.0
    candidate_max_new_gaussians_per_frame: 1000
    render_policy: owner_neighbor_fill
    render_selection_policy: temporal
    render_max_visible_submaps: 0
    render_max_visible_gaussians: 0
    render_bounds_inflate: 0.05
    render_bounds_min_projected_area: 0.0
    render_frame_margin: 20
    render_past_frame_margin: 20
    render_future_frame_margin: 0
    render_owner_alpha_fill_thres: 0.001
    render_fill_blend_weight: 0.20
    render_nonsequential_overlaps: false
    render_min_owner_age_frames: 0
    render_min_ready_frames: 16
    render_owner_min_ready_frames: 0
    render_neighbor_min_ready_frames: 16
    render_min_neighbor_gaussians: 0
    render_fill_require_sdf_hole: true
    render_adaptive_kernel: 5
    render_adaptive_alpha_scale: 2.0
    render_adaptive_min_weight: 0.02
    render_adaptive_boundary_feather: 0.25
    render_adaptive_depth_thres: 0.05
    render_blend_alpha_thres: 0.1
    render_blend_depth_thres: 0.05
    render_blend_max_weight: 0.2
    render_blend_weight_scale: 0.2
    render_neighbor_alpha_fill_thres: 0.05
    render_include_handoff_submaps: false
    render_single_submap_passthrough: false
    render_single_submap_passthrough_requires_single_logical_map: false
    render_use_local_sdf_reference: true
    render_overlap_diagnostics: false
    cross_submap_novelty_gate: false
    cross_novelty_alpha_thres: 0.7
    cross_novelty_depth_abs_thres: 0.03
    cross_novelty_depth_rel_thres: 0.01
    cross_novelty_photometric_thres: 0.2
    cross_novelty_max_reference_submaps: 0
    cross_novelty_previous_only: true
    cross_novelty_resident_only: true
    cross_novelty_erode_kernel: 3
    pose_graph_identity_check: false
    pose_graph_synthetic_check: false
    pose_graph_overlap_roundtrip_check: false
    pose_graph_overlap_roundtrip_tolerance: 0.0001
    pose_graph_render_identity_check: false
    pose_graph_render_synthetic_check: false
    pose_graph_synthetic_submap_id: -1
    pose_graph_synthetic_translation: [0.01, 0.0, 0.0]

  pose_graph:
    candidate_detection: false
    optimize: false
    dry_run: false
    dry_run_include_loop_candidates: false
    dry_run_use_estimated_loop_transforms: true
    dry_run_max_sequential_translation_residual: 0.0001
    dry_run_max_sequential_rotation_residual_deg: 0.1
    dry_run_max_loop_translation_residual: 0.30
    dry_run_max_loop_rotation_residual_deg: 30.0
    solve_only: false
    solve_only_include_loop_candidates: false
    solve_only_use_estimated_loop_transforms: true
    solve_only_max_translation_delta: 0.30
    solve_only_max_rotation_delta_deg: 30.0
    sequential_constraint_weight: 4.0
    loop_constraint_weight: 1.0
    apply_mode: disabled
    apply_use_estimated_loop_transforms: true
    apply_max_translation_delta: 0.30
    apply_max_rotation_delta_deg: 30.0
    apply_max_sequential_translation_residual: 0.008
    apply_max_sequential_rotation_residual_deg: 0.75
    apply_min_translation_delta: 0.0
    online_updates: false
    candidate_interval_frames: 30
    run_on_submap_events: true
    max_updates_per_run: 0
    loop_min_submap_separation: 3
    max_candidate_pairs_per_check: 16
    loop_max_distance: 0.75
    loop_max_rotation_deg: 60.0
    loop_max_candidates: 16
    loop_observation_interval_frames: 10
    loop_observation_max_per_submap: 8
    candidate_verification: keyframe_pose
    orb_feature_cache: true
    orb_feature_cache_limit: 256
    orb_max_features: 1000
    orb_ratio: 0.75
    orb_min_quadrants: 3
    verify_max_keyframe_distance: 0.75
    verify_max_keyframe_rotation_deg: 60.0
    verify_max_depth_error: 0.08
    verify_min_depth_overlap: 0.10
    verify_depth_sample_stride: 16
    verify_icp_min_inliers: 64
    verify_icp_max_rmse: 0.05
    verify_icp_max_translation_delta: 0.25
    verify_icp_max_rotation_delta_deg: 20.0
    verify_icp_ransac: true
    verify_icp_ransac_iterations: 128
    verify_icp_ransac_threshold: 0.04
    verify_icp_ransac_min_inlier_ratio: 0.25
    verify_icp_max_score: 0.5
    verify_max_observation_pairs: 32
    verify_min_observations: 2
    verify_observation_max_translation_delta: 0.05
    verify_observation_max_rotation_delta_deg: 5.0


MODEL:
  # rendering parameters
  render_method: ges
  max_gs_radii: 100
  delta_depth: 0.1
  ges_residual_scale: 1.0
  ges_base_color_weight: 1.0
  
  # gs init params
  sh_degree: 3 
  sh_degree_interval: 0
  max_init_scale: 0.01
  min_init_scale: -1
  default_opacities: 0.5

  # learning rates
  means_lr: 0.00016
  means_lr_final: 0.0000016
  scales_lr: 0.005
  quats_lr: 0.001
  featuresDc_lr: 0.0025
  featuresRest_lr: 0.0005
  opacities_lr: 5e-2
  exposure_lr: 0.003
  use_exposure: false

  # densify parameters
  densify_start_iter: 500
  densify_end_iter: 6000
  densify_interval: 100
  densify_grad_thres: 0.0002
  densify_large_thres: 0.01
  split_screen_size: 0.05 
  reset_opacity_interval: 3000
  prune_opacity_thres: 0.005
